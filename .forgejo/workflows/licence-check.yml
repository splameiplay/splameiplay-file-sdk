name: Licence Check
run-name: ${{ github.workflow }} -triggered by- ${{ github.actor }} -via- ${{ github.event_name }} ${{ github.sha }} ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.py"
      - "**.slnx"
  pull_request:
  workflow_dispatch:

jobs:
  check-licence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check licences
        uses: https://github.com/apache/skywalking-eyes/header@main