name: Run tests
run-name: ${{ github.workflow }} -triggered by- ${{ github.actor }} -via- ${{ github.event_name }} ${{ github.sha }} ${{ github.event.head_commit.message }}

on:
  push:
    branches: 
      - main
    paths:
      - "**.py"
      - "**.toml"
      - "requirements.txt"
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List python
        run: python3 --version

      - name: Setup python
        run: |
          cd ./src/Python/
          apt-get update
          apt-get install -y python3 python3-venv python3-pip
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd ./src/Python/
          pip install pytest
          pip install --upgrade build

          echo
          echo "Building the package!"
          python3 -m build --wheel
          pip install dist/*.whl

      - name: Run tests
        run: |
          cd ./src/Python/
          pytest