name: Bug Report
description: Report a bug with the SDK
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please only report issues caused by the SDK itself (so not from incorrct configs or external software) and it hasn't already been reported
  - type: textarea
    id: description
    attributes:
      label: What is the issue
      description: Please describe the issue, what went wrong and what was meant to happen
      placeholder: When doing x, y happened when z should have happened
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Affected version(s)
      description: What versions of the SDK does the issue occur on
      multiple: true
      options:
        - 1.0.0.x (Pre-release)
      default: 0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected platforms
      description: Which platforms did you get the error to occur on
      multiple: true
      options:
        - Laptop
        - Desktop
        - Mini PC
        - Emulated or Translated Hardware
      default: 0
    validations:
      required: true
  - type: dropdown
    id: osVersion
    attributes:
      label: Affected OS(es)
      description: What different OSes did you get the issue to occur on
      multiple: true
      options:
        - Windows 10 or 11
        - Pre Windows 10 (i.e 8.x + 7)
        - Translator App
        - Other
      default: 0
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Affected language
      description: Which language(s) did you get the error to occur on
      multiple: true
      options:
        - C# (.NET Framework)
        - C# (.NET Core)
        - Python
      default: 0
    validations:
      required: true
  - type: textarea
    id: debugLog
    attributes:
      label: Log files
      description: If there is any logs that could help with debugging (i.e. error messages), please paste it here
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: Once you submit this issue, you agree to our [Code of Conduct](https://github.com/splameiplay/splameiplay-file-sdk/blob/main/CODE_OF_CONDUCT.md). 
      options:
        - label: I agree to the code of conduct, that this was made in good faith and no duplicate issue exist
          required: true